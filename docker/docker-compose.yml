# Production (ARCHITECTURE §8). Run from the repository root, so the .env there is used:
#   docker compose --env-file .env -f docker/docker-compose.yml up -d --build
name: uni-scrims

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-database-url: &database-url "postgresql://uniscrims:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}@db:5432/uniscrims"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is not set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: *database-url
      UPLOAD_DIR: /data/uploads
      LEGAL_DIR: /config/legal
    volumes:
      - uploads:/data/uploads
      # Long syntax: without docker/legal on the host, `up` fails instead of mounting an empty
      # directory, so the site never goes online without Impressum and privacy policy.
      - type: bind
        source: ./legal
        target: /config/legal
        read_only: true
        bind:
          create_host_path: false
    # node:24-slim has neither curl nor wget.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  # No port and no access to the uploads volume.
  bot:
    build:
      context: ..
      dockerfile: Dockerfile
      target: bot
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  # One-off job: prisma migrate deploy. web and bot start only after it succeeded.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  # Port not published.
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: uniscrims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: uniscrims
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniscrims -d uniscrims"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
